name: elixir

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: 
          - elixir: 1.14.5
            otp: 24.3

          - elixir: 1.15.8
            otp: 25.3

          - elixir: 1.16.3
            otp: 26.2

          - elixir: 1.18.2
            otp: 27.2
    steps:
      - uses: actions/checkout@v2
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}
      - run: mix deps.get
      - run: mix test
